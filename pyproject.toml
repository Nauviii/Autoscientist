[project]
name = "dsar"
version = "0.1.0"
description = "Human-in-the-loop agentic research system for GBDT predictive modeling"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "catboost>=1.2",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
dsar = "dsar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
